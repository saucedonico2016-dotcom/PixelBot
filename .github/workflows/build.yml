name: Build PixelBot APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
          accept-android-sdk-licenses: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Download Vosk model (small Spanish)
        run: |
          mkdir -p ears/src/main/assets/vosk-model
          cd ears/src/main/assets
          wget -q --show-progress "https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip" -O vosk-model.zip
          unzip -q vosk-model.zip
          mv vosk-model-small-es-0.42/* vosk-model/
          rm -rf vosk-model-small-es-0.42 vosk-model.zip

      - name: Build with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx3g -Dfile.encoding=UTF-8"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixelbot-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload APK size info
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "APK Size: $SIZE"
          echo "apk_size=$SIZE" >> $GITHUB_OUTPUT
        id: apk_info

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34
          accept-android-sdk-licenses: true

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: "**/build/reports/tests/**"

  release:
    name: Build Release APK
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
          accept-android-sdk-licenses: true

      - name: Download Vosk model
        run: |
          mkdir -p ears/src/main/assets/vosk-model
          cd ears/src/main/assets
          wget -q "https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip" -O vosk-model.zip
          unzip -q vosk-model.zip
          mv vosk-model-small-es-0.42/* vosk-model/
          rm -rf vosk-model-small-es-0.42 vosk-model.zip

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon
        env:
          GRADLE_OPTS: "-Xmx3g -Dfile.encoding=UTF-8"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: pixelbot-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90